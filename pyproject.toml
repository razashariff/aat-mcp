[project]
name = "aat-mcp"
version = "0.1.0"
description = "Conformant AAT (draft-sharif-agent-audit-trail-06) audit-trail recorder + MCP middleware: signed, hash-chained, tamper-evident, offline-verifiable evidence for AI agent tool calls."
requires-python = ">=3.9"
readme = "README.md"
dependencies = ["rfc8785>=0.1.4", "cryptography>=42"]
license = "Apache-2.0"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
pydantic-ai = ["pydantic-ai-slim>=0.3"]
all = ["langchain-core>=0.3", "pydantic-ai-slim>=0.3"]

[project.urls]
Standard = "https://datatracker.ietf.org/doc/draft-sharif-agent-audit-trail/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aat"]

[tool.hatch.build.targets.sdist]
include = ["aat", "tests", "README.md", "pyproject.toml"]
